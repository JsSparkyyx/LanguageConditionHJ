    - "don't touch {obj}"
    - "avoid {obj}"
    - "keep away from {obj}"
    - "do not touch {obj}"
    - "don't bump into {obj}"
    - "don't hit {obj}"
    - "steer clear of {obj}"
    - "keep the arm away from {obj}"
    - "make sure you don't touch {obj}"
    - "don't brush against {obj}"
    - "go around {obj}"
    - "don't make contact with {obj}"
    - "keep clear of {obj}"
    - "never touch {obj}"
    - "don't knock into {obj}"
