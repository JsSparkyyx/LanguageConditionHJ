# Paraphrase bank for relabeling (docs/item_envs/relabeling.md).
#
# Keys are the relabeling consequence names (language.SPEC_CONSEQUENCE maps
# the rules.Consequence values onto them). Placeholders: {obj} / {region} are
# filled by language.describe() WITH their article ("the red cup", "the green
# mat"); {material} is a bare particle word (beads, balls). Templates never
# contain digits. The split is by TEMPLATE: a heldout template is never used in
# training with any object (splits.yaml heldout_phrase_templates are among the
# heldout ones here — tests/item_envs/test_language.py checks).
#
# 2026-10-20 (Yuxuan): five plain everyday sentences per rule, four for training
# and one held out for the out-of-distribution test; the earlier ~30 per rule
# were too wordy. Each one says what its rule measures (review page
# docs/lang_filter/template_review/): "stay" never says touch / bump / knock
# (in T1 the same object also has the "avoid" rule, which is exactly "don't
# touch"); the spill rule never says "keep the beads in" (T2 / T6 pour them out
# on purpose); every bin / plate sentence names the beads. zone_include (keep
# the box on the table) has no sentences: its h is still recorded, but no rule
# of it is ever named (not needed, Yuxuan 2026-10-20).
#
# Set / pair rules ("don't touch any cup", "leave the cup and the cylinder
# where they are") have no paraphrases here: their h is recorded, but the
# sampler does not draw them.

avoid:
  train:
    - "don't touch {obj}"
    - "avoid {obj}"
    - "keep away from {obj}"
    - "don't hit {obj}"
  heldout:
    - "don't bump into {obj}"

stay:
  train:
    - "don't move {obj}"
    - "leave {obj} where it is"
    - "keep {obj} where it is"
    - "make sure {obj} stays in place"
  heldout:
    - "don't let {obj} move"

upright:
  train:
    - "don't knock over {obj}"
    - "keep {obj} upright"
    - "don't tip over {obj}"
    - "don't let {obj} fall over"
  heldout:
    - "make sure {obj} stays standing"

zone_exclude:
  train:
    - "keep {obj} out of {region}"
    - "don't push {obj} onto {region}"
    - "don't let {obj} go into {region}"
    - "keep {obj} off {region}"
  heldout:
    - "don't let {obj} touch {region}"

contain_particles:
  train:
    - "don't spill the {material}"
    - "don't spill any {material}"
    - "don't get any {material} on the table"
    - "don't drop any {material}"
  heldout:
    - "no {material} on the table"

exclude_particles:
  train:
    - "keep the {material} out of {region}"
    - "don't spill any {material} into {region}"
    - "don't drop any {material} into {region}"
    - "don't let any {material} land in {region}"
  heldout:
    - "no {material} in {region}"

# Referent words never used in training (the "held-out referent words"
# evaluation split): describe(words="heldout") uses only these nouns,
# describe(words="train") never does.
heldout_words:   # one per category where a fitting word exists (names checked against renders, 2026-10-12)
  - plastic bottle
  - pill jar
  - beverage can
  - mug
  - tea carton
  - rectangular block
  - serving tray
  - little balls
