# Names, synonyms, nominal mass ranges, and colors for items and regions.
#
# Item keys match the pools in PLAN §7/§9 (asset ids and primitive names);
# ItemSpec.category is one of these keys. `category` is the plain alias used by
# splits.yaml heldout_item_categories. Mass ranges are kg (PLAN §7 "Nominal
# masses"; unlisted categories are plausible defaults). Names and synonyms must
# never contain digits (they land in rendered phrases).

# Color palette for primitives and zone mats. purple/orange/cyan are the
# heldout colors (splits.yaml); the rest are train-only.
colors: [red, green, blue, yellow, white, black, brown, pink, purple, orange, cyan]

items:
  # --- bottles / cups / cans (tippable pool) ---
  001_bottle:      {category: bottle, names: [bottle], synonyms: [flask, water bottle], mass_range: [0.05, 0.30]}
  114_bottle:      {category: bottle, names: [bottle], synonyms: [flask], mass_range: [0.05, 0.30]}
  021_cup:         {category: cup, names: [cup], synonyms: [glass], mass_range: [0.05, 0.25]}
  039_mug:         {category: mug, names: [mug], synonyms: [cup, coffee mug], mass_range: [0.05, 0.25]}
  071_can:         {category: can, names: [can], synonyms: [tin, tin can], mass_range: [0.05, 0.35]}
  105_sauce-can:   {category: sauce_can, names: [sauce can], synonyms: [can, jar], mass_range: [0.10, 0.40]}
  080_pill_bottle: {category: pill_bottle, names: [pill bottle], synonyms: [pill jar, small bottle], mass_range: [0.02, 0.06]}

  # --- stable / small rigid items ---
  086_woodenblock: {category: block, names: [block, wooden block], synonyms: [cube], mass_range: [0.05, 0.15]}
  075_bread:       {category: bread, names: [bread, loaf], synonyms: [loaf of bread], mass_range: [0.03, 0.08]}
  102_roller:      {category: roller, names: [roller], synonyms: [rolling pin], mass_range: [0.05, 0.20]}
  048_stapler:     {category: stapler, names: [stapler], synonyms: [], mass_range: [0.10, 0.25]}
  113_coffee-box:  {category: coffee_box, names: [coffee box], synonyms: [box of coffee, coffee bag], mass_range: [0.10, 0.30]}

  # --- containers / furniture ---
  002_bowl:        {category: bowl, names: [bowl], synonyms: [], mass_range: [0.10, 0.40]}
  003_plate:       {category: plate, names: [plate], synonyms: [dish], mass_range: [0.10, 0.35]}
  008_tray:        {category: tray, names: [tray], synonyms: [serving tray], mass_range: [0.15, 0.35]}
  011_dustbin:     {category: dustbin, names: [dustbin], synonyms: [trash bin, wastebasket], mass_range: [0.50, 1.50]}
  015_laptop:      {category: laptop, names: [laptop], synonyms: [laptop computer], mass_range: [1.20, 2.20]}
  019_coaster:     {category: coaster, names: [coaster], synonyms: [], mass_range: [0.01, 0.05]}
  060_kitchenpot:  {category: pot, names: [pot, kitchen pot], synonyms: [saucepan], mass_range: [0.40, 1.20]}
  062_plasticbox:  {category: plastic_box, names: [plastic box], synonyms: [container], mass_range: [0.05, 0.20]}
  063_tabletrashbin: {category: bin, names: [bin, table bin], synonyms: [small trash bin], mass_range: [0.10, 0.30]}
  076_breadbasket: {category: basket, names: [bread basket], synonyms: [basket], mass_range: [0.10, 0.30]}
  110_basket:      {category: basket, names: [basket], synonyms: [], mass_range: [0.10, 0.30]}

  # --- granular particle set (one ItemSpec, kind: particle_set) ---
  beans:           {category: beans, names: [beans], synonyms: [beads, rice, grains], mass_range: [0.0005, 0.002]}  # per particle

  # --- primitives (colored: a color word prefixes the name) ---
  prim_tall_cylinder: {category: cylinder, names: [cylinder, tall cylinder], synonyms: [], mass_range: [0.05, 0.20], colored: true}
  prim_cylinder:      {category: cylinder, names: [cylinder], synonyms: [], mass_range: [0.05, 0.20], colored: true}
  prim_low_box:       {category: block, names: [block, low block], synonyms: [box], mass_range: [0.05, 0.15], colored: true}
  prim_box:           {category: box, names: [box], synonyms: [block], mass_range: [0.05, 0.15], colored: true}
  prim_sphere:        {category: ball, names: [ball, sphere], synonyms: [], mass_range: [0.01, 0.05], colored: true}
  prim_pingpong:      {category: ball, names: [ping-pong ball, ball], synonyms: [], mass_range: [0.0027, 0.0027], colored: true}
  prim_small_block:   {category: block, names: [small block, block], synonyms: [], mass_range: [0.005, 0.03], colored: true}
  prim_short_cylinder: {category: cylinder, names: [short cylinder, cylinder], synonyms: [], mass_range: [0.005, 0.03], colored: true}

regions:
  tray_top:       {names: [tray], synonyms: [serving tray]}
  table_top:      {names: [table], synonyms: [tabletop]}
  drawer_floor:   {names: [drawer], synonyms: []}
  board_top:      {names: [board], synonyms: [cutting board]}
  cup_interior:   {names: [cup], synonyms: [mug]}
  box_interior:   {names: [box], synonyms: [container]}
  bowl_interior:  {names: [bowl], synonyms: []}
  bin_interior:   {names: [bin], synonyms: [trash bin]}
  zone:           {names: [zone, mat], synonyms: [marked area], colored: true}  # e.g. "red zone"
  laptop:         {names: [laptop], synonyms: [laptop computer]}

# Phrase templates per consequence (mirrors the defaults in rules.py; a task may
# override per consequence). Held-out templates live ONLY in splits.yaml.
templates:
  inside: ["keep the {item} on the {region}", "don't let the {item} fall off the {region}"]
  outside: ["keep the {item} out of the {region}", "don't let the {item} get into the {region}"]
  upright: ["don't knock over the {item}", "keep the {item} upright"]
  stay: ["don't disturb the {item}", "leave the {item} where it is"]
  particles_inside: ["don't spill the {item}", "keep the {item} in the {region}"]
  particles_outside: ["keep the {item} off the {region}", "don't get any {item} on the {region}"]
