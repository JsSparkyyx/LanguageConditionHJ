# T4 granular_carry — pick up a FULL bowl of beads with ONE arm (the arm on
# the bowl's side) and place it on a target pad without spilling a bead
# (user request 2026-10-03, revised: single arm, no forbidden mats).
#
# robotwin_tasks/granular_carry.py owns the layout; the constants below
# mirror its module constants (tests/item_envs/test_granular_carry.py).
# The bowl is filled until the top bead centre is >= brim_clear below the rim,
# so a tilt of ~12 deg or a sharp start / stop spills the top layer. The
# nominal levels the bowl right after lift-off (a single rim pinch lets it
# sag ~15-20 deg) and carries it level.
#
# Expected rule table:
#   particles_inside|beads|bowl_src_interior     ("don't spill the beans")

task: granular_carry
robotwin_task: granular_carry
embodiments: [ur5-wsg, franka-panda]
bowl_model: 002_bowl
bowl_ids: [1, 2, 3, 5]
modes: {table: 0.3, held: 0.7}   # table: grasp at t >= 0; held: brim-full bowl grasped + levelled BEFORE t = 0, spilled beads removed
held: {pack_fill: 1.15, settle_steps: 250}   # x the bowl's random-pack rim capacity (volume-based)
beads: {n_max: 240, radius: 0.006, mass: [0.0005, 0.002], brim_clear: 0.010, pack: random, pack_fill: 1.1}   # top-layer gap to the rim 11-19 mm by bowl id (12.6 mm layer pitch)
start: {abs_x: [0.15, 0.28], y: [-0.02, 0.08]}       # side drawn per episode; that side's arm carries
target: {abs_x: [0.08, 0.30], y: [-0.24, -0.12], min_dist: 0.20, pad_size: 0.16}   # pad on the bowl's side, toward the robot, >= min_dist away (dark frame)
carry: {step: 0.03, speed: 0.25, safe_speed: 0.10, risky_step_min_t: 0.08, liftoff: 0.015, level_iters: 2, gripper_stiffness: 5000, bowl_mass: [0.10, 0.20],
        grasp_dis: 0.02, grasp_radial_out: 0.006}   # shallow, wall-centred rim pinch: a deep pinch flicks top beads out
risk:
  time_scale: {dist: choice, values: [0.5, 0.75, 1.0, 1.15, 1.3]}   # carry speed multiplier
  safe_time_scale: 0.6
  task:
    carry_tilt_deg: {dist: uniform, range: [-35.0, 35.0]}  # signed tilt held during the carry (after leveling)
    carry_height: {dist: uniform, range: [0.04, 0.12]}     # m lift above the table
rules:
  - {consequence: particles_inside, items: {role: candidate, kind: particle_set}, regions: [bowl_src_interior], T: 0.001}
embodiment_overrides:
  ur5-wsg:      {grasp_contact_ids: [0, 2], grasp_dis: 0.02}     # diag d15-d26: 0.0225 slipped 1-in-4 during leveling; 0.025 slips
  franka-panda: {grasp_contact_ids: [0, 2], grasp_dis: 0.0125}   # diag d20 (0.015: 6/6), d26 (0.015 slipped 1-in-4)
risk_collect: null
