# T4 granular_carry — ONE arm (the arm on the bowl's side) carries a bowl of
# beads >= 20 cm to a target frame and places it without spilling a bead
# (user reviews 2026-10-03 / 10-04).
#
# robotwin_tasks/granular_carry.py owns the layout; the constants below
# mirror its module constants (tests/item_envs/test_granular_carry.py).
# The bowl has a RAISED FLOOR (interior 2.5 cm deep, outer rim unchanged):
# a thin random-pack bead layer that rolls at small tilts and sloshes with
# speed. Modes: table (grasp at t >= 0) / held (brim-full bowl grasped and
# levelled in the pre-roll, spilled beads deleted before t = 0). The nominal
# levels the bowl after lift-off (a single rim pinch lets it sag ~15-20 deg).
#
# Expected rule table:
#   particles_inside|beads|bowl_src_interior     ("don't spill the beans")

task: granular_carry
robotwin_task: granular_carry
embodiments: [ur5-wsg, franka-panda]
bowl_model: 002_bowl
bowl: {interior_depth: 0.032}   # raised floor: rim this far above the interior floor (create_bowl_raised_floor)
table: {fill_frac: 0.8, fill_frac_emb: {ur5-wsg: 0.5}}   # table mode: beads = this x the raised-floor bowl's random-pack rim capacity; ur5: its rim pinch lets the lifted bowl sag 6-11 deg, the load spilled at the lift-off (0.8: 3/8, 0.65: 2/8, t4table/2)
bowl_ids: [1, 2, 3, 5]
modes: {table: 0.3, held: 0.7}   # table: grasp at t >= 0; held: brim-full bowl grasped + levelled BEFORE t = 0, spilled beads removed
held: {pack_fill: 1.0, settle_steps: 500}   # x the bowl's random-pack rim capacity (volume-based): level-full, no heap
beads: {n_max: 240, radius: 0.006, mass: [0.0005, 0.002], brim_clear: 0.010, pack: random, pack_fill: 1.1}   # spawn mass only (physics resamples objects.yaml carry_beads 0.3-0.8 g); brim_clear / pack_fill: plain-bowl (depth 0) fill
start: {abs_x: [0.15, 0.28], y: [-0.02, 0.08]}       # side drawn per episode; that side's arm carries
target: {abs_x: [0.08, 0.30], y: [-0.24, -0.12], min_dist: 0.20, pad_size: 0.16}   # pad on the bowl's side, toward the robot, >= min_dist away (dark frame)
carry: {step: 0.03, speed: 0.25, safe_speed: 0.10, risky_step_min_t: 0.08, liftoff: 0.015, level_iters: 2, gripper_stiffness: 5000, bowl_mass: [0.10, 0.20],
        grasp_dis: 0.02, grasp_radial_out: 0.006,   # shallow, wall-centred rim pinch: a deep pinch flicks top beads out
        accel_dist: 0.06, stop_dist: 0.02, stop_dist_emb: {franka-panda: 0.01}}   # ONE continuous carry (user review 7): smooth start, cruise, brake within stop_dist at the pad (peak decel 0.75 v^2 / stop_dist)
risk:
  time_scale: {dist: choice, values: [0.5, 0.75, 1.0, 1.15, 1.3]}   # carry speed multiplier
  safe_time_scale: 0.6
  task:
    carry_tilt_deg: {dist: uniform_abs, range: [20.0, 40.0]}  # tilt held during the carry, |tilt| U[20, 40] with a random sign (user review 7, option 3; calibration 2026-10-05: at 12-35 the spill rate was 26-38 %)
    carry_height: {dist: uniform, range: [0.04, 0.12]}     # m lift above the table
rules:
  - {consequence: particles_inside, items: {role: candidate, kind: particle_set}, regions: [bowl_src_interior], T: 0.001}
embodiment_overrides:
  # preshape_open: jaw opening for the rim pinch and its release (ur5 11 cm / franka 8 cm full):
  # fully open, the inner finger swept the bead bed over the rim at the grasp and the release (audit 2026-10-04)
  # ur5 0.6 (6.6 cm): at 0.27 / 0.4 the held pre-roll pinch missed the wall 3/4 (the ur5 grasp lands 1-2 cm off; held probe 2026-10-04), at 0.6 2/2 lifted
  ur5-wsg:      {grasp_contact_ids: [0, 2], grasp_dis: 0.02, preshape_open: 0.6}      # diag d15-d26: 0.0225 slipped 1-in-4 during leveling; 0.025 slips
  franka-panda: {grasp_contact_ids: [0, 2], grasp_dis: 0.0125, preshape_open: 0.38}   # diag d20 (0.015: 6/6), d26 (0.015 slipped 1-in-4)
risk_collect: null
