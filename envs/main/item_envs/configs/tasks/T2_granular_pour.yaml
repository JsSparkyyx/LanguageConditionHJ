# T2 granular_pour — carry a bowl of beads, pour into a target container,
# spill no bead (PLAN v3 §7 T2; forbidden-mat rules dropped 2026-10-03).
#
# The robotwin_tasks/granular_pour.py task file owns the layout (bowl pool,
# bead grid); the constants below mirror its module constants
# and are cross-checked by tests/item_envs/test_granular_pour.py.
#
# Expected rule table (user decision 2026-10-03: the only safety constraint
# is "spill no bead"; the forbidden-mat rules and the mats were dropped):
#   particles_inside|beads|bowl_src_interior+target_interior
# Bead margins are the HARD min over beads (2026-10-07): margin < 0 exactly
# when a bead breaks the rule, the case margins.particle_h counts. A soft-min
# temperature T is an explicit opt-in per entry (none set): it sits up to
# T*ln(N) below the worst bead (1 mm x ln 100 = 4.6 mm), which read 0 near the
# rim and could go negative with every bead inside (the reason the default
# 0.005 had been lowered to 0.001 here, p4-accept shard 2).

task: granular_pour
robotwin_task: granular_pour
embodiments: [ur5-wsg, franka-panda]     # first entry is the default
bimanual: false                          # true: second arm holds the (dynamic) target during the pour
bowl_model: 002_bowl
src: {interior_depth: 0.032, fill_frac: 0.8}   # SOURCE bowl: raised floor (interior 3.2 cm) + random pack at fill_frac x lattice capacity, capped at beads.n (user review 5)
src_container: {ur5-wsg: mug, franka-panda: mug}  # source per embodiment (user reviews 6, 8: franka-specific grasp redesign)
mug: {model: 039_mug, ids: [0, 1, 2, 5, 10, 11], interior_depth: 0.035, fill_frac: 1.15, n_max: 120, yaw_deg: {ur5-wsg: 0.0, franka-panda: -45.0}}  # handled source: handle faces the robot, raised floor; over-filled, trimmed level with the rim by the pre-roll
bowl_ids: [1, 2, 3, 5]                   # passed P2 rest containment at (60 beads, 6 mm)
beads: {n: 100, radius: 0.006, mass: [0.0005, 0.002]}  # P2 rest-containment was
                                        # validated at N=60; N=100 fills the bowl to
                                        # roughly one layer near the rim — intentional,
                                        # makes transport spill easier (user request).
                                        # masses in kg
target: {model: 002_bowl_deep, static: true}  # bimanual variant: dynamic
risk:
  time_scale: {dist: choice, values: [0.5, 0.75, 1.0, 1.15, 1.3]}   # transit retime
  safe_time_scale: 0.6
  task:
    tilt_rate: {dist: uniform, range: [1.0, 4.0]}        # rad/s, pour wrist rate
    pour_height: {dist: uniform, range: [0.05, 0.20]}    # m above the target rim; the task
                                        # clamps the EFFECTIVE height to >= src outer radius + 0.015
                                        # (rim-ring interlink floor, ~0.072-0.083 per bowl id)
    pour_offset: {dist: uniform, range: [0.0, 0.05]}     # m, lateral, toward a side drawn per episode
rules:
  - {consequence: particles_inside, items: {role: candidate, kind: particle_set}, regions: [bowl_src_interior, target_interior]}
embodiment_overrides:                     # installed as task.embodiment_params by the runner
  # 002_bowl grasp contact ids [right arm, left arm]: 0/2 = host idiom; 1/3 =
  # the same rim point with the gripper turned 180 deg about vertical.
  # (t2_pour_feasibility probe, 2026-10-03: with either id set ur5-wsg can
  # only pour over the -y side lip; franka pours over the far lip.)
  # gripper_stiffness (optional): firmer rim pinch for ur5's side-lip tilt,
  # which rotates about the pinch line (RoboTwin default 1000).
  # grasp_dis / grasp_radial_out: shallow, wall-centred pinch (T4 values,
  # diag d15-d27) — the default pinch ejected the pile at the grasp (d34);
  # franka's soft pinch slipped during the tilt in 5/8 d34 pours -> 5000.
  # pour_style wrist_roll (ur5, user-approved 2026-10-04): wrist 1 (+/-1.75 rad) blocks every
  # top-down-grasp tilt but a side-lip one, which failed to plan / flung the bowl (d37, d39);
  # instead a tangent rim grasp pitched 30 deg down + a roll about the approach axis (d45)
  # ur5 pours from the handled mug (src.container, user review 6): the
  # tangent rim pinch let the bowl turn 40-70 deg in the grip (d47); the
  # flat handle loop fills the pads. tip_len = EE origin -> closed fingertips
  # (measured, T3 push_tip_len) keeps the fingertips off the mug body.
  # roll_pitch_deg 40 (ur5): at 30 deg both planners land the RIGHT arm's
  # hand 2-3 cm / 11 deg off the handle grasp (the two UR5 mounts differ),
  # at 40 deg within 0.7 cm / 0.4 deg (d55); the roll then tips the mug at
  # most 180 - 2 x 40 = 100 deg, enough to empty the 4 cm interior (d56)
  ur5-wsg:      {grasp_contact_ids: [0, 2], gripper_stiffness: 5000, grasp_dis: 0.02, grasp_radial_out: 0.006, pour_style: wrist_roll, tip_len: 0.164, roll_pitch_deg: 40}
  franka-panda: {grasp_contact_ids: [0, 2], gripper_stiffness: 5000, grasp_dis: 0.0125, grasp_radial_out: 0.006, tip_len: 0.152}

risk_collect:                            # calibration 2026-10-05 (exposed 0.91, success 0.49); docs/item_envs/calibration.md
  safe_time_scale: 0.6
  cells:                                 # time_scale pinned per cell; the task knobs keep sampling from risk.task
    - {weight: 1.0, time_scale: 0.5, task: {}}
    - {weight: 1.0, time_scale: 0.75, task: {}}
    - {weight: 1.0, time_scale: 1.0, task: {}}
    - {weight: 1.0, time_scale: 1.15, task: {}}
    - {weight: 1.0, time_scale: 1.3, task: {}}
