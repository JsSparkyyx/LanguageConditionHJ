task: selective_avoid
host_tasks: [place_container_plate, place_burger_fries, stack_blocks_two, stack_bowls_two, place_bread_basket]
                                        # allowed hosts; an episode with no explicit --host
                                        # ROTATES round-robin by seed (seed k -> host_tasks[k % 5])
embodiments: [ur5-wsg, franka-panda]
# F5: restrict off_path candidates to the empirically-visible table band
# (main/item_envs/configs/visibility_band_<embodiment>.npz, built by
# scripts/item_envs/visibility_band.py) — far-corner cells sit outside every
# camera frustum (P4-T1 off_path vis gate 0.642 < 0.95).
# F5b: near/on_path candidates PREFER the same npz's measured per-cell
# `covered` mask (vis_max >= 0.3 at the cell) — the band rerun still gated
# near_path 0.947 / on_path 0.948 < 0.95. Covered preference inside the
# original candidate sequence; when no covered cell appears the original
# first-ok placement is kept and vis_fallback=true recorded (gate tolerates
# 5%). Fused single pass after the ur5 A/B showed the two-loop version
# regressed near_path (0.959 -> 0.897); Bridges re-validation pending.
objects: {k: [2, 3], max_on_path: 2,   # at most 3 extra objects (Yuxuan 2026-10-22; was 3-5); 2 = the on/near quota
          min_on_or_near_path: 2, near_path_offset: [0.02, 0.06],
          off_path_min_dist: 0.10, min_separation: 0.03, static_objects: false,
          on_path_max_r_xy: 0.06, near_path_max_r_xy: 0.06,   # 2026-10-22 (was 0.035): wine glasses 1 / 2 and the bottles fit
          # on the path. Sweep of 100 layouts (runs/lang/corpus_render): 0.035 / 0.06 / 0.16 left 9 / 8 / 14 layouts empty;
          # books and kettles never fit on or near the path at any of them (they stand off the path only)
          off_path_visible_only: true,
          near_path_visible_only: true, on_path_visible_only: true,
          distinct_categories: true,   # user 2026-10-05: no repeated category in a scene, none of the host's (every candidate nameable)
          min_robot_clearance: 0.02}   # m at t = 0 (after the settle): the avoid buffer 1 cm + 1 cm (3/194 layouts started inside the buffer)
corridor_t: [0.22, 0.48]
# nominal_mode="safe" (runner, 2026-10-22: the expert for safe demonstrations): cuRobo plans around the protected
# objects (the named rule's, or every extra object when no rule is named, as the demo collector runs it) with the WSG
# hand and the held object modelled (safe_plan.py), no fallback planner. Keep rule (the demo collector's, Yuxuan
# 2026-10-27): no contact between an extra object and anything but the table at any physics step, force < 20 N (the
# filter's 1 cm buffer is not required; 2 cm left only 1/8 scenes finished, 10-22).
# 2026-10-27: each object is its convex hull grown by `margin` (shape hull; obb = the 10-22 boxes, 1.4-3.7 cm too big
# on round and tapered objects), the real tabletop is in the world `table_clearance` low (RoboTwin's own table cuboid
# is misplaced), a plan that starts in collision / finds no IK / no route is retried at `retry_margins` (the held
# object's margin, at most `payload_margin`, shrinks with it), then, for a start in collision only, without the held
# object and without the hand (`drop_models`); a grasp search that fails with ur5-wsg's one stock pose tries ten
# approach tilts over `grasp_rotate_lim` rad (the stock pose first). Stock speed (time_scale 1 = no retime), as the
# collision-avoidance demos.
safe_mode:
  plan: obstacle_aware
  protect: named
  margin: 0.01
  retry_margins: [0.005, 0.002]
  drop_models: [hand, none]
  payload_margin: 0.01
  shape: hull
  table: true
  table_clearance: 0.02
  grasp_rotate_lim: [0.0, 0.8]
  risk: {time_scale: 1.0, safe_time_scale: 1.0}
risk:
  time_scale: {dist: choice, values: [0.6, 0.8, 1.0, 1.15, 1.3]}
  safe_time_scale: 0.6
  task:
    on_path_count: {dist: choice, values: [1, 2]}
# T1 risky-segment selection (PLAN v3 §2.5/§7 T1): the hosts run unmodified,
# so RiskTickController picks risky segments by skill type — it substring-
# matches the CEHJ skill tracker's task._cehj_skill label
# (main/envs/controller.py::_install_skill_tracker) against these tags and
# plans with time_scale on a match, safe_time_scale otherwise. The tracker
# stamps "{side} pre_place {actor}" / "{side} place {actor}" from
# place_actor (the carry over the table is the pre_place action) and
# "{side} lift {delta}" from move_by_displacement (the post-grasp raise
# with payload). Approach/grasp (pre_grasp/grasp/close) and the
# release/retreat (open/home) stay at the safe scale. Note the tracker's
# "lift" tag cannot tell the post-grasp raise from the post-place retreat
# lift (both are move_by_displacement): both run risky — the retreat lift
# is vertical and empty-handed, so the mislabel is benign (documented in
# docs/item_envs/task_cards/T1.md).
risky_skill_labels: [pre_place, place, lift]
# Host-actor registration (PLAN v3 §7 T1 Items): attr = the RoboTwin task
# attribute holding the actor (lists expand to <attr><i>), role per the plan
# (pick objects task_object, targets support). category is the objects.yaml
# key for physics/meta; category_from resolves it from a task attribute at
# runtime (place_container_plate's container is 002_bowl OR 021_cup).
# up_axis_local defaults to [0, 1, 0] (RoboTwin glb Y-up convention);
# create_box blocks are world-aligned, hence [0, 0, 1]. Meta-only in T1:
# no rule ever references task_object/support items.
host_objects:
  place_container_plate:
    - {attr: container, role: task_object,
       category_from: {attr: actor_name, map: {002_bowl: bowl, 021_cup: cup}, default: bowl}}
    - {attr: plate, role: support, category: plate}
  place_burger_fries:
    - {attr: hamburg, role: task_object, category: hamburg}
    - {attr: frenchfries, role: task_object, category: frenchfries}
    - {attr: tray, role: support, category: tray}
  stack_blocks_two:
    - {attr: block1, role: task_object, category: wooden_block, up_axis_local: [0, 0, 1]}
    - {attr: block2, role: task_object, category: wooden_block, up_axis_local: [0, 0, 1]}
  stack_bowls_two:
    - {attr: bowl1, role: task_object, category: bowl}
    - {attr: bowl2, role: task_object, category: bowl}
  place_bread_basket:
    - {attr: bread, role: task_object, category: bread}
    - {attr: breadbasket, role: support, category: basket}
rules:
  - {consequence: avoid, items: {role: candidate}, margin: 0.01}   # user 2026-10-05: with the real-shape distance a touch reads ~0; keep 1 cm away -> every touch reads < 0 (952/952 PhysX touch ticks, least -0.4 cm)
  - {consequence: avoid, items: {role: candidate, same_category_min: 2}, set_rule: true, margin: 0.01}
  - {consequence: avoid, items: {role: candidate}, set_rule: all, margin: 0.01}     # CrossSafe baseline
  - {consequence: stay, items: {role: candidate}, d_tol: 0.03, theta_tol_deg: 20}
risk_collect:                            # calibration 2026-10-05, re-run with the real-shape distance + 1 cm buffer, 10-type pool, no repeats (exposed 0.85 — ur5 0.81, franka 0.88; success 0.70); docs/item_envs/calibration.md
  safe_time_scale: 0.6
  cells:                                 # time_scale pinned per cell; the task knobs keep sampling from risk.task
    - {weight: 1.0, time_scale: 0.5, task: {}}
    - {weight: 1.0, time_scale: 0.75, task: {}}
    - {weight: 1.0, time_scale: 1.0, task: {}}
    - {weight: 1.0, time_scale: 1.15, task: {}}
    - {weight: 1.0, time_scale: 1.3, task: {}}
