# gap_place — T7 item-safety task config (overnight 2026-10-04: an
# OBJECT-oriented, TEXT-conditioned task with rigid items). Mirrors the module
# constants in robotwin_tasks/gap_place.py (tests/item_envs/test_gap_place.py
# source-greps them).
#
# One arm picks a wooden block top-down, gripped LOW, and lowers it into a
# SLOT between two standing colored blocks (flankers in front of / behind the
# slot along y, clearance per side). The place_offset knob shifts the place
# point toward ONE flanker (the "hit" one): beyond the clearance the payload's
# bottom edge comes down on that flanker's inner top edge — a slim flanker
# tips, a short wide one is shoved. Every flanker is shorter than the payload
# (the palm sits at ~its top): only the payload can touch one.
#
# Rules: upright + stay per standing block. Primary = the referent's upright:
# the hit flanker (p 0.6), the other flanker (p 0.25, benign: the nominal
# shoves the other side) or an off-slot bystander (p 0.15, benign). The safe
# correction (shift away from the named block) depends on the text.

task: gap_place
robotwin_task: gap_place
embodiments: [ur5-wsg, franka-panda]     # first is the default

start: {abs_x: [0.22, 0.30], y: [-0.10, -0.02]}
slot: {abs_x: [0.0, 0.06], y: [-0.06, 0.02], min_travel: 0.15, clearance: [0.015, 0.025]}   # clearance > the ~1 cm ur5 placement error (d-t7a)
payload: {w: [0.04, 0.045], h: [0.055, 0.065], mass: [0.05, 0.12]}   # gripped low: it cannot pivot on a flanker (a tall one gripped at its top did, d-t7b)
items:
  tall:  {w: [0.014, 0.018], h: [0.042, 0.048]}   # slim pillar, tips at 16-23 deg
  short: {w: [0.04, 0.05], h: [0.025, 0.03]}
  flanker_kind_p: {tall: 0.75, short: 0.25}
  bystander_p: 0.5
  bystander_dx: [0.08, 0.11]                      # beside the slot, away from the payload's start
  bystander_dy: [-0.03, 0.03]
  mass: [0.05, 0.15]
  colors: [red, green, blue, yellow]
referent: {hit: 0.6, other: 0.25, bystander: 0.15}
motion: {safe_speed: 0.10, descent_speed: 0.10, transit_clear: 0.04, tip_clear: 0.012, place_clear: 0.004, jaw_margin: 0.03, gripper_stiffness: 5000}
success_tol: 0.02

risk:
  time_scale: {dist: choice, values: [0.5, 0.75, 1.0, 1.15, 1.3]}   # descent speed multiplier (0.05-0.13 m/s)
  safe_time_scale: 0.6
  task:
    place_offset: {dist: uniform, range: [0.0, 0.028]}  # m along y toward the hit flanker (clearance 1.5-2.5 cm; overlap <= 1.3 cm < the slimmest pillar)

rules:
  - {consequence: upright, items: {role: candidate}, theta_max_deg: 10}
  - {consequence: stay, items: {role: candidate}, d_tol: 0.02, theta_tol_deg: 20}

embodiment_overrides:
  # tip_len: EE origin -> closed fingertips (measured, T3 push_tip_len);
  # jaw_full_width: fully open finger gap (the pre-shape = payload w + jaw_margin)
  ur5-wsg:      {tip_len: 0.164, gripper_stiffness: 5000, jaw_full_width: 0.11}
  franka-panda: {tip_len: 0.152, gripper_stiffness: 5000, jaw_full_width: 0.08}

risk_collect: null
