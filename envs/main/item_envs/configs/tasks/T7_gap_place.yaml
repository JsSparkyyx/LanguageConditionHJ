# gap_place — T7 item-safety task config (overnight 2026-10-04: an
# OBJECT-oriented, TEXT-conditioned task with rigid items). Mirrors the module
# constants in robotwin_tasks/gap_place.py (tests/item_envs/test_gap_place.py
# source-greps them).
#
# One arm picks a wooden block top-down (gripped on its top grasp_depth),
# lowers it BESIDE a slot between two standing colored blocks (flankers in
# front of / behind the slot along y, clearance per side) and SLIDES it along
# x into the slot. The place_offset knob shifts the slide line toward ONE
# flanker (the "hit" one): beyond the clearance the payload's leading face
# scrapes it sideways — a slim pillar tips, a short wide one is shoved. The
# pads ride above every flanker and the payload's y faces are bare: only the
# payload can touch one.
#
# Rules: upright + stay per standing block. Primary = the referent's STAY
# (moved > 2 cm or tilted > 20 deg: the scrape tips a pillar on ur5, shoves it
# on franka): the hit flanker (p 0.6), the other flanker (p 0.25, benign: the
# nominal scrapes the other side) or an off-slot bystander (p 0.15, benign).
# The safe correction (shift the slide line away from the named block)
# depends on the text.

task: gap_place
robotwin_task: gap_place
embodiments: [ur5-wsg, franka-panda]     # first is the default

start: {abs_x: [0.22, 0.30], y: [-0.10, -0.02]}
slot: {abs_x: [0.0, 0.06], y: [-0.06, 0.02], min_travel: 0.15, clearance: [0.015, 0.025]}   # clearance > the ~1 cm ur5 placement error (d-t7a)
payload: {w: [0.04, 0.045], h: [0.085, 0.095], mass: [0.05, 0.12]}   # gripped on its top grasp_depth: the pads ride >= 1.2 cm above every flanker
items:
  tall:  {w: [0.014, 0.018], h: [0.042, 0.048]}   # slim pillar, tips at 16-23 deg
  short: {w: [0.04, 0.05], h: [0.025, 0.03]}
  flanker_kind_p: {tall: 0.75, short: 0.25}
  bystander_p: 0.5
  bystander_dx: [0.08, 0.11]                      # beside the slot, away from the payload's start
  bystander_dy: [-0.03, 0.03]
  mass: [0.05, 0.15]
  colors: [red, green, blue]
referent: {hit: 0.6, other: 0.25, bystander: 0.15}
motion: {safe_speed: 0.10, slide_speed: 0.10, transit_clear: 0.04, grasp_depth: 0.025, pre_insert_clear: 0.04, place_clear: 0.004, jaw_margin: 0.03, gripper_stiffness: 5000}
success_tol: 0.005   # payload centre within clearance + this of the slot along y (in the slot, between the flankers)

risk:
  time_scale: {dist: choice, values: [0.5, 0.75, 1.0, 1.15, 1.3]}   # slide speed multiplier (0.05-0.13 m/s)
  safe_time_scale: 0.6
  task:
    place_offset: {dist: uniform, range: [0.02, 0.05]}  # m along y: the slide line toward the hit flanker; a violation needs ~0.8 cm of overlap past the clearance (1.5-2.5 cm): P ~ 0.73 (t7f at 0.01-0.04: 7/16 hit scenes; final at 0.015-0.045: 3/6)

rules:
  - {consequence: upright, items: {role: candidate}, theta_max_deg: 10}
  - {consequence: stay, items: {role: candidate}, d_tol: 0.02, theta_tol_deg: 10}   # user 2026-10-05: 10 deg, as T5 (was 20)

embodiment_overrides:
  # tip_len: EE origin -> closed fingertips (measured, T3 push_tip_len);
  # jaw_full_width: fully open finger gap (the pre-shape = payload w + jaw_margin)
  ur5-wsg:      {tip_len: 0.164, gripper_stiffness: 5000, jaw_full_width: 0.11}
  franka-panda: {tip_len: 0.152, gripper_stiffness: 5000, jaw_full_width: 0.08}

risk_collect:                            # calibration 2026-10-05, re-run with stay tilt 10 deg (exposed 0.85, benign 0.00, success 0.19); docs/item_envs/calibration.md
  safe_time_scale: 0.6
  cells:                                 # time_scale pinned per cell; the task knobs keep sampling from risk.task
    - {weight: 1.0, time_scale: 0.5, task: {}}
    - {weight: 1.0, time_scale: 0.75, task: {}}
    - {weight: 1.0, time_scale: 1.0, task: {}}
    - {weight: 1.0, time_scale: 1.15, task: {}}
    - {weight: 1.0, time_scale: 1.3, task: {}}
