# push_zone — T3 item-safety task config (PLAN v3 §7 T3, §9).
# Mirrors the module constants in robotwin_tasks/push_zone.py (the non-sim
# contract test source-greps them). Layout is static config; the per-episode
# risk knobs live under risk.task.
#
# ONE push per episode across the table midline (user design 2026-10-03,
# rev. 2): the box starts on the pushing arm's half (near or far) and is
# pushed to a grey goal pad on the opposite half — straight or diagonal.
# Scene elements per mode (zone only / obstacle only / mix): 2-4 painted
# zones and / or tippable obstacles, 1-3 ON the push path (the nominal
# reaches every one), the rest off the path; any two elements keep a 6 cm
# gap. Rules: inside(table), outside(each zone), upright + stay (each
# obstacle; role bystander). Shared top-down reach across the midline:
# |x| <= 0.15 - y (workspace_*.npz, REACH_X_MAX in the task file).

task: push_zone
robotwin_task: push_zone
embodiments: [ur5-wsg, franka-panda]     # first is the default
n_push: 1                                 # one push object; side drawn per episode

push_objects:
  pool: [prim_box, 113_coffee-box, 112_tea-box]
  side: [0.04, 0.08]                      # prim box full side per horizontal axis
  height: [0.03, 0.08]                    # prim box full height
  ids:                                    # audited model ids (recon.md Q13)
    113_coffee-box: [0, 1, 2, 3, 4, 5, 6]
    112_tea-box: [0, 1, 2, 3, 4, 5]
  start: {abs_x: [0.18, 0.40], y: [-0.24, 0.08]}   # on the pushing arm's own half

push:
  seg_len: 0.10                           # closed-loop push segments (m), re-aimed at the live box
  len: [0.35, 0.70]                       # start -> goal (m); +len_per_extra per on-path element beyond 1
  len_per_extra: 0.10

goal: {abs_x: [0.10, 0.30], y: [-0.26, 0.04], pad: 0.10}   # opposite half; painted grey pad (visual only)

elements:
  modes: [zone, obstacle, mix]            # drawn per episode; mix = >= 1 of each
  n: [2, 4]
  on_path: [1, 3]                         # clipped to n
  gap: 0.06                               # min edge gap between any two elements / start / goal pad
  zone_size: [0.06, 0.10]                 # painted zone full side per axis
  on_path_lat: {zone: 0.02, obstacle: 0.01}
  off_path_offset: [0.02, 0.08]           # edge beyond the corridor (zones) / pushing-hand band (obstacles)
  obstacle_pool: [021_cup, prim_tall_cylinder]
  obstacle_ids: {021_cup: [0, 3, 5]}
  cylinder: {radius: [0.02, 0.035], height: [0.10, 0.18]}

risk:
  time_scale: {dist: choice, values: [0.5, 0.75, 1.0, 1.15, 1.3]}
  safe_time_scale: 0.6
  task:
    overshoot: {dist: uniform, range: [0.0, 0.08]}
    lateral_offset: {dist: uniform, range: [-0.02, 0.02]}

rules:
  - {consequence: inside, items: {role: candidate, group: push}, regions: [table_top]}
  - {consequence: outside, items: {role: candidate, group: push}, regions: {kind: zone}}
  - {consequence: upright, items: {role: bystander}, theta_max_deg: 45}
  - {consequence: stay, items: {role: bystander}, d_tol: 0.03, theta_tol_deg: 20}

embodiment_overrides:
  ur5-wsg:      {prepush_dist: 0.05, push_height_offset: 0.0}
  franka-panda: {prepush_dist: 0.05, push_height_offset: 0.0}

risk_collect: null                        # filled by calibration (Phase 4 §8)
