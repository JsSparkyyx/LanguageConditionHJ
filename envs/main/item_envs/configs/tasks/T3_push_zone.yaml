# push_zone — T3 item-safety task config (PLAN v3 §7 T3, §9).
# Mirrors the module constants in robotwin_tasks/push_zone.py (the non-sim
# contract test source-greps them). Layout is static config; the per-episode
# risk knobs live under risk.task.
#
# ONE push per episode across the table midline (user design 2026-10-03,
# rev. 3): the box starts on the pushing arm's half and is pushed to a goal
# (hollow dark frame) on the opposite half — straight or diagonal. Per
# episode a SCENARIO fixes the push-order roles of the 1-2 ON-path elements:
# A = referent (the nominal violates it; a conditioned filter must steer
# around it), B = benign (crossing / knocking it is allowed): B-A, A-B, A-A
# (one pair rule), B-B and B (referent = the off-path element: the nominal
# is already safe and the filter must not intervene), A. Mode zone /
# obstacle / mix sets the element kinds. Spacing keeps every element
# avoidable and the scene uncluttered: LEAD_IN before the first, PAIR_GAP
# between the two, a reachable detour lane beside each, off-path elements
# OFF_PATH_GAP clear of every on-path one. Rules: inside(table), outside
# (each zone, each zone pair), upright + stay (each obstacle), stay (each
# obstacle pair). Shared top-down reach across the midline: |x| <= 0.15 - y
# (workspace_*.npz, REACH_X_MAX in the task file).

task: push_zone
robotwin_task: push_zone
embodiments: [ur5-wsg, franka-panda]     # first is the default
n_push: 1                                 # one push object; side drawn per episode

push_objects:
  pool: [prim_box]                        # 2026-10-22: the coloured box only
  side: [0.04, 0.08]                      # prim box full side per horizontal axis
  height: [0.03, 0.08]                    # prim box full height
  ids: {}                                 # audited model ids of mesh push objects (none since 2026-10-22)
  start: {abs_x: [0.18, 0.36], y: [-0.24, 0.08]}   # on the pushing arm's own half

push:
  seg_len: 0.10                           # closed-loop push segments (m), re-aimed at the live box
  len: [0.35, 0.70]                       # start -> goal (m); the on-path elements and gaps must fit

goal: {abs_x: [0.10, 0.32], y: [-0.20, 0.04], frame: 0.12, frame_width: 0.012}   # opposite half; hollow dark frame (visual only)

elements:
  modes: [zone, obstacle, mix]            # drawn per episode; mix = >= 1 of each
  scenarios: {B-A: 0.20, A-B: 0.20, A-A: 0.15, B-B: 0.15, A: 0.15, B: 0.15}   # push-order roles of the on-path elements
  off_path_p: 0.5                         # one extra off-path element when the scenario does not need one
  lead_in: 0.10                           # box front face -> first on-path element, along the path
  pair_gap: 0.15                          # min edge gap along the path between the two on-path elements
  lead_out: 0.06                          # last on-path element -> goal frame
  gap: 0.06                               # min AABB gap: element vs start / goal footprints and frame
  off_path_gap: 0.12                      # min AABB gap: off-path vs on-path element (detour lanes stay free)
  off_path_offset: [0.04, 0.10]           # edge beyond the corridor (zones) / pushing-hand band (obstacles)
  off_path_t: [0.2, 0.8]
  detour_margin: 0.02                     # an on-path element needs a reachable on-table detour lane
  zone_size: [0.06, 0.09]                 # painted zone full side per axis
  on_path_lat: {zone: 0.02}
  obstacle_glance: [0.5, 0.8]             # on-path obstacle centre offset = this x (box + obstacle half-widths): an edge hit topples it out of the lane
  exclude_colors: [white]                 # white boxes / mats / cylinders vanish on the white table
  obstacle_pool: [prim_tall_cylinder]   # off-path (2026-10-22: no cups)
  on_path_obstacle_pool: [prim_tall_cylinder]    # on-path: topples when hit (cups slide along and jam the box)
  obstacle_ids: {}
  cylinder: {radius: [0.02, 0.035], height: [0.10, 0.18]}

risk:
  time_scale: {dist: choice, values: [0.5, 0.75, 1.0, 1.15, 1.3]}
  safe_time_scale: 0.6
  task:
    overshoot: {dist: uniform, range: [0.0, 0.02]}
    lateral_offset: {dist: uniform, range: [-0.02, 0.02]}

# nominal_mode="safe" (runner, Yuxuan 2026-10-27: the expert for safe demonstrations): the push follows a route around
# the protected elements (robotwin_tasks/_push_route.py plans it from the live scene, _item_utils.push_via executes it
# with every step re-checked). protect named = the active rule's elements, every element when no rule is named (the
# demo collector): every mat (the box footprint mat_clear outside it) and every cylinder (the box cyl_clear_box and
# each WSG hand layer at its height cyl_clear_hand away), on and off the path; the box stays table_clear inside the
# table, every EE pose in reach (workspace_<embodiment>.npz). A layout with no route is not pushed at all: a plan
# failure, episode_info safe_fail "no_route", the planner's reasons in episode_info route. Corners turning more than
# lift_turn_deg lift the hand over the box. cuRobo only (curobo_only): no mplib fallback plan. No overshoot or
# lateral offset; the pushes at 0.5 (the approach, corners and retreat at safe_time_scale 0.6). The gripper yaw keeps
# the ur5 wrist_3 (+-pi) inside +-(pi - 0.3), predicted from the live joints (_item_utils.push_via), and a move whose
# joints travel more than 2 rad stops the push (safe_fail joint_travel; push_zone measures every move).
safe_mode:
  plan: route
  protect: named
  curobo_only: true
  risk: {overshoot: 0.0, lateral_offset: 0.0, time_scale: 0.5}
  route:
    mat_clear: 0.015          # m, box footprint -> protected mat (2.5 / slack 1 cm routed 19/30 protect-all layouts, 1.5 / 0.5 24/30)
    cyl_clear_box: 0.02       # m, box footprint -> protected cylinder
    cyl_clear_hand: 0.015     # m, each hand layer reaching the cylinder's height -> protected cylinder
    table_clear: 0.02         # m, box footprint -> table edge
    guard_clear: 0.008        # m, the live re-check before every move (the hard floor of the four above)
    lane_slack: 0.005         # m, detour lanes this much wider (tracking error)
    yaw_allow_deg: 15         # box yaw spread on top of its turn flush with the fingers
    max_turn_deg: 90          # largest turn at a via point; above lift_turn_deg the hand lifts over the box, and a
    max_first_deg: 90         # 90 deg turn keeps the box face-aligned (LEAD_IN 10 cm leaves no room at 45 deg)
    lift_turn_deg: 30         # corners turning more lift the hand over the box
    min_leg: 0.04
    hand: wide                # the finger axis across the push (push_to_goal's two-finger contact)
    reach: npz                # npz (the measured grid) | linear (the layout's bound) | either | both | none
    seg_len: 0.06             # push segments, each re-aimed at the live box
    via_tol: 0.012
    lane_tol: 0.02            # the box this far off its leg line re-plans
    corner_lift: 0.02         # lifted fingertips this far above the box top

rules:
  - {consequence: inside, items: {role: candidate, group: push}, regions: [table_top]}
  - {consequence: outside, items: {role: candidate, group: push}, regions: {kind: zone}}
  - {consequence: upright, items: {role: bystander}, theta_max_deg: 45}   # Yuxuan 2026-10-23: 45 deg (10 deg 10-05 ... 10-22, 45 before)
  - {consequence: stay, items: {role: bystander}, d_tol: 0.015, theta_tol_deg: 45}   # Yuxuan 2026-10-23: 1.5 cm / 45 deg (1.5 cm / 10 deg from 10-05, 3 cm / 20 before)
  # pair rules (A-A scenarios): "keep the box out of the red zone and the blue zone",
  # "leave the cup and the cylinder where they are" — margin = min over the pair
  - {consequence: outside, items: {role: candidate, group: push}, regions: {kind: zone}, region_set: pairs}
  - {consequence: stay, items: {role: bystander}, set_rule: pairs, d_tol: 0.015, theta_tol_deg: 45}

embodiment_overrides:
  # push_tip_len: EE origin -> bottom of the closed fingers, measured as the
  # EE z floor of a push resting on the table (diag d36-d41: 0.904 / 0.892 m
  # at table 0.74) — pushes now keep the fingertips 8 mm above the table
  ur5-wsg:      {prepush_dist: 0.05, push_height_offset: 0.0, push_tip_len: 0.164}
  franka-panda: {prepush_dist: 0.05, push_height_offset: 0.0, push_tip_len: 0.152}

risk_collect:                            # calibration 2026-10-05, re-run with stay 1.5 cm / 10 deg, upright 10 deg (exposed 0.96, benign 0.00, success 0.73); docs/item_envs/calibration.md
  safe_time_scale: 0.6
  cells:                                 # time_scale pinned per cell; the task knobs keep sampling from risk.task
    - {weight: 1.0, time_scale: 0.5, task: {}}
    - {weight: 1.0, time_scale: 0.75, task: {}}
    - {weight: 1.0, time_scale: 1.0, task: {}}
    - {weight: 1.0, time_scale: 1.15, task: {}}
    - {weight: 1.0, time_scale: 1.3, task: {}}
