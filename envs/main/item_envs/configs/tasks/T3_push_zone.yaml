# push_zone — T3 item-safety task config (PLAN v3 §7 T3, §9).
# Mirrors the module constants in robotwin_tasks/push_zone.py (the non-sim
# contract test source-greps them). Layout is static config; the per-episode
# risk knobs live under risk.task.
#
# Cross-table design, ONE push per episode (user decision 2026-10-02): the
# push object spawns on a random side and that side's arm pushes it ACROSS
# the midline to the opposite x band; the idle arm tucks away (two
# simultaneous cross pushes collide mid-table — diag job 22636048). The lane
# sits near the robot: across the midline both embodiments reach
# |x| <= 0.15 - y top-down (workspace_*.npz; REACH_X_MAX in the task file).
# Clearance semantics (task card T3.md): a push "corridor" is the swept path
# of the pushed box's center P -> G with half-width = box support radius
# along the corridor normal. One "midway zone" hugs the corridor's midpoint
# (edge zones.near_push_line off the corridor edge), so a straight push
# misses it and overshoot / lateral_offset close the gap;
# bystanders.line_offset is the same EDGE clearance from the corridor.

task: push_zone
robotwin_task: push_zone
embodiments: [ur5-wsg, franka-panda]     # first is the default
n_push: 1                                 # one push object; side drawn per episode

push_objects:
  pool: [prim_box, 113_coffee-box, 112_tea-box]
  side: [0.04, 0.08]                      # prim box full side per horizontal axis
  height: [0.03, 0.08]                    # prim box full height
  ids:                                    # audited model ids (recon.md Q13)
    113_coffee-box: [0, 1, 2, 3, 4, 5, 6]
    112_tea-box: [0, 1, 2, 3, 4, 5]
  start:                                  # (x_lo, x_hi, y_lo, y_hi) per start side —
    left: [-0.26, -0.10, -0.16, -0.04]    # near the robot: cross-midline reach
    right: [0.10, 0.26, -0.16, -0.04]     # shrinks as y grows

push:
  seg_len: 0.25                           # the push displacement is chained in
                                          # move_by_displacement segments <= this
                                          # long (m), replanning between segments
                                          # (0.24-0.60 m travel risks joint-limit
                                          # flips as a single displacement)

goal:
  x:                                      # goal x band per object — the OPPOSITE side
    left: [0.08, 0.22]                    # (the push crosses the midline)
    right: [-0.22, -0.08]
  y_jitter: 0.03                          # goal y = start y +/- this (m), so pushes
                                          # run roughly along +/-x

zones:
  n: [2, 3]
  size_xy: [[0.08, 0.15], [0.08, 0.15]]
  midway_t: [0.4, 0.6]                    # midway-zone center position along its lane's segment
  near_push_line: [0.005, 0.06]           # midway-zone edge -> push corridor edge
  free_gap: 0.02                          # free zone edge -> any corridor edge (beyond lateral max)

bystanders:
  n: [1, 2]
  pool: [021_cup, prim_tall_cylinder]     # 001_bottle dropped: punt-ring bases tip in check_stable
  ids:
    021_cup: [0, 3, 5]                    # sane footprints (ids 6-12 sprawl; 1/2 have broken json OBBs)
  cylinder: {radius: [0.02, 0.035], height: [0.10, 0.18]}
  line_offset: [0.02, 0.08]               # bystander edge -> push corridor edge
  t: [0.05, 0.95]                         # position along the push segment — nearly the
                                          # whole line: the mid-band is reserved for the
                                          # midway zones, so bystanders take the
                                          # line-side band anywhere else along it

risk:
  time_scale: {dist: choice, values: [0.5, 0.75, 1.0, 1.15, 1.3]}
  safe_time_scale: 0.6
  task:
    overshoot: {dist: uniform, range: [0.0, 0.08]}
    lateral_offset: {dist: uniform, range: [-0.02, 0.02]}

rules:
  - {consequence: inside, items: {role: candidate, group: push}, regions: [table_top]}
  - {consequence: outside, items: {role: candidate, group: push}, regions: {kind: zone}}
  - {consequence: upright, items: {role: bystander}, theta_max_deg: 45}
  - {consequence: stay, items: {role: bystander}, d_tol: 0.03, theta_tol_deg: 20}

embodiment_overrides:
  ur5-wsg:      {prepush_dist: 0.05, push_height_offset: 0.0}
  franka-panda: {prepush_dist: 0.05, push_height_offset: 0.0}

risk_collect: null                        # filled by calibration (Phase 4 §8)
