# ur5-wsg collision spheres for the item_envs failure function (robot_distance.py).
#
# RoboTwin's assets/embodiments/ur5-wsg/collision_wsg.yml models a ROBOTIQ 85
# gripper (robotiq_85_* links) while the robot carries a WSG-50: those spheres
# match no link, so the WSG gripper had NO spheres and its touches were
# invisible to the avoid distance (2026-10-05 check against PhysX contacts:
# 53/313 real ur5 touches read <= 5 mm, the distance read +3.7 cm too far on
# median). This file = the arm spheres of that file (base .. wrist_3, ee_link)
# + spheres fitted to the WSG collision meshes (meshes/gripper/*.stl, link
# frames): >= 98 % of each mesh's surface inside a sphere (worst gap 6 mm),
# spheres stick out 2-5 mm typically, <= 1.6 cm (conservative).
# RoboTwin's file is untouched (never modify RoboTwin files).
