# Physical-property randomization ranges (PLAN v3 §2.1) and margin scaling
# reference values (PLAN v3 §5, κ is applied downstream, never in the env).
#
# Sampling rules (§2.1): draw static friction first, then dynamic ≤ static.
# The center-of-mass offset applies in x and y only (§2.1).

static_friction: [0.3, 0.9]        # U(lo, hi), drawn first
dynamic_friction: [0.2, static]    # U(lo, sampled static); "static" refers to the drawn value
restitution: [0.0, 0.1]
mass_scale: [0.7, 1.3]             # × per-category nominal mass (objects.yaml mass_range midpoint)
com_offset_xy: [-0.2, 0.2]         # × half extents, applied in x and y only (§2.1)

# The failure function h (margins stay raw SI here; h is formed downstream):
# h = clip(margin / h_unit, -1, 1), h_unit per rule (margins.h_unit, user
# 2026-10-05 — the old per-consequence kappa table gave ranges ~4x apart:
# T5's upright topped out at 2/rad x 10 deg = 0.35, distance rules at 1.0+):
#   avoid / inside / outside / particles_outside   5 cm   (h = 20 x metres, CrossSafe's kappa)
#   particles_inside ("don't spill")       1 cm   (a resting bead sits 1.0-1.2 cm inside; never named from 2026-10-23)
#   upright                                the rule's theta_max (45 deg in T3 / T5 / T7 -> 1.27/rad,
#                                          Yuxuan 2026-10-23; 10 deg -> 5.7/rad before)
#   stay                                   the rule's d_tol (tilt converted to metres: a tilt of theta_tol
#                                          counts like d_tol; theta_tol 45 deg in T3 / T7 from 2026-10-23,
#                                          10 deg from 2026-10-05; T1 3 cm / 20 deg)
# The clip at -1 replaces the old margin_floor table (beads rolling off the
# table / objects launched by a contact glitch read -18 ... -464 unclipped;
# audit 2026-10-04); the clip at +1 = "comfortably safe". Traces keep the raw
# margins.
