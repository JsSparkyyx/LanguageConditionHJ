# Physical-property randomization ranges (PLAN v3 §2.1) and margin scaling
# reference values (PLAN v3 §5, κ is applied downstream, never in the env).
#
# Sampling rules (§2.1): draw static friction first, then dynamic ≤ static.
# The center-of-mass offset applies in x and y only (§2.1).

static_friction: [0.3, 0.9]        # U(lo, hi), drawn first
dynamic_friction: [0.2, static]    # U(lo, sampled static); "static" refers to the drawn value
restitution: [0.0, 0.1]
mass_scale: [0.7, 1.3]             # × per-category nominal mass (objects.yaml mass_range midpoint)
com_offset_xy: [-0.2, 0.2]         # × half extents, applied in x and y only (§2.1)

# κ per consequence (reference only; downstream scaling, margins stay raw SI here).
# 20/m for distance-type margins (matches CrossSafe's h_scale), 2/rad for upright.
kappa:
  avoid: 20                        # 1/m
  inside: 20                       # 1/m
  outside: 20                      # 1/m
  stay: 20                         # 1/m
  upright: 2                       # 1/rad
  particles: 20                    # 1/m (particles_inside / particles_outside)

# Failure-depth floor (raw SI, per consequence) applied where the TRAINING h is
# formed (margin_hook.ItemMarginHFn): margin >= -floor, so h >= -kappa * floor
# = -1 for every rule (CrossSafe's h never goes far below -1: penetration).
# Beads rolling along the floor and objects launched by a contact glitch read
# -18 ... -464 in h raw (audit 2026-10-04); the sign and the boundary are
# untouched, traces keep the raw margins.
margin_floor:
  avoid: 0.05                      # m
  inside: 0.05                     # m
  outside: 0.05                    # m
  stay: 0.05                       # m
  upright: 0.5                     # rad
  particles: 0.05                  # m
